# Nginx delante del panel. Cambiar el dominio; certbot agrega el bloque HTTPS.
server {
    listen 80;
    listen [::]:80;
    server_name certificador.konos.cl;

    # Un .env pesa unos pocos KB.
    client_max_body_size 64k;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Log en vivo (Server-Sent Events): sin buffer y con conexiones largas.
    location ~ ^/api/trabajos/[^/]+/eventos$ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Connection '';
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 2h;
    }
}
